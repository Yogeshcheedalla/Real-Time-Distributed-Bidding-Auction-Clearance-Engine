server:
  port: ${PORT:8081}
  # behind the gateway: build absolute URLs (OAuth redirect_uri) from X-Forwarded-*
  # so Google sees http://localhost:8080/login/oauth2/code/google (the registered URI)
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/bidvelocity_auth
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema — never auto-create
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: [openid, email, profile]
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

bidvelocity:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-gateway-secret-change-me-32}
    access-minutes: ${JWT_ACCESS_MINUTES:120}
    refresh-days: ${JWT_REFRESH_DAYS:14}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  demo:
    seed: ${DEMO_SEED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # correlation id + service + operation fields, no secrets/tokens ever logged
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [auth-service] %-5level [cid:%X{correlationId:-}] %msg%n"

springdoc:
  title: BidVelocity Auth Service API
  description: Registration, login, JWT + refresh rotation, roles, Google OAuth2, admin user management
  version: 0.1.0
