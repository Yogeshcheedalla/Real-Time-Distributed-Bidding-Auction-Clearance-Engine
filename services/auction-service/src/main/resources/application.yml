server:
  port: ${PORT:8082}

spring:
  application:
    name: auction-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/bidvelocity_auction
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

bidvelocity:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-gateway-secret-change-me-32}
  clients:
    bidding: ${BIDDING_URL:}   # empty → resolve via Eureka lb
  demo:
    seed: ${DEMO_SEED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [auction-service] %-5level [cid:%X{correlationId:-}] %msg%n"

springdoc:
  title: BidVelocity Auction Service API
  description: Marketplace search, auction lifecycle state machine, scheduling, transactional outbox
  version: 0.1.0
