spring:
  datasource:
    url: jdbc:h2:mem:auctiontest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

bidvelocity:
  scheduler:
    enabled: false
  jwt:
    secret: integration-test-secret-at-least-32-bytes!!!!
  clients:
    bidding: ""

logging:
  level:
    root: WARN
    io.bidvelocity: INFO
