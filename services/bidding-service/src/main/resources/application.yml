server:
  port: ${PORT:8083}

spring:
  application:
    name: bidding-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/bidvelocity_bidding
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20      # hot path needs headroom for FOR UPDATE queueing
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

bidvelocity:
  jwt:
    secret: ${JWT_SECRET:}
  clients:
    auction: ${AUCTION_URL:}     # empty → resolve via Eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [bidding-service] %-5level [cid:%X{correlationId:-}] %msg%n"
