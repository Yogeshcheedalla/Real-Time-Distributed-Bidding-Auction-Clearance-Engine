server:
  port: ${PORT:8761}

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # single-node local dev: self-preservation on, no eviction storm
    enable-self-preservation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
