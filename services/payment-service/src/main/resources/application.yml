server:
  port: ${PORT:8084}

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/bidvelocity_payment
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

bidvelocity:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-gateway-secret-change-me-32}
  clients:
    auction: ${AUCTION_URL:}
  payments:
    poll-ms: 5000
    timeout-minutes: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [payment-service] %-5level [cid:%X{correlationId:-}] %msg%n"

springdoc:
  title: BidVelocity Payment Service API
  description: Winner invoices from WINNER_DECLARED events, payment state machine, provider abstraction
  version: 0.1.0
